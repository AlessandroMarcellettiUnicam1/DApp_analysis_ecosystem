services:
  server:
    build: Backend/.
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - local-network
    environment:
      - MONGO_URI=mongodb://mongo:27017/backlog 
      - REDIS_HOST=redis-db
    depends_on:
      - mongo
      - redis-db

  client:
    build: Frontend/.
    restart: unless-stopped
    command: npm run dev -- --force --host
    ports:
      - "5173:5173"
    networks:
      - local-network

  coblockly-backend:
    build: CoBlocklyBackend/.
    restart: unless-stopped
    ports:
      - "8001:8000" # Porta 8001 per non entrare in conflitto con il servizio server che utilizza 8000
    networks:
      - local-network

  mongo:
    image: mongo:latest
    restart: unless-stopped
    container_name: mongo
    ports:
      - "27017:27017"  # Porta standard per MongoDB
    networks:
      - local-network
    volumes:
      - mongo-data:/data/db  # Volume per persistenza dei dati cambiato in quello standard
      
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    container_name: mongo-express
    ports:
      - "8081:8081"  # Porta per l'interfaccia web di Mongo Express
    networks:
      - local-network
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/backlog  # URL di connessione a MongoDB
    depends_on:
      - mongo  # Dipende dal servizio mongo

  redis-db:
    image: redis:alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - local-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mempool-worker:
    build: ./Backend
    command: node services/realTimeCompliance/mempoolWorker.js
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/backlog
    networks:
      - local-network  
    depends_on:
      redis-db:
        condition: service_healthy 
      coblockly-backend:
        condition: service_started
    volumes:
      - ./metrics:/app/metrics

  baseline-worker:
    build: ./Backend
    command: node services/realTimeCompliance/baselineWorker.js
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/backlog
    networks:
      - local-network  
    depends_on:
      redis-db:
        condition: service_healthy 
      coblockly-backend:
        condition: service_started
    volumes:
      - ./metrics:/app/metrics

networks:
  local-network: {}

volumes:
  mongo-data:
